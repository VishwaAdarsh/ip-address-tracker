[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-pulse"
version = "2.0.0"
description = "IP Intelligence, Geolocation & Website Risk Analysis Platform"
readme = "README.md"
authors = [{ name = "IP PULSE Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pandas>=2.0.0",
    "reportlab>=4.0.0",
    "dnspython>=2.3.0",
    "pytest>=8.0.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
]

[project.scripts]
ip-pulse = "backend.app:main"